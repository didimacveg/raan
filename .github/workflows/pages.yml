# Daily: polite CelesTrak fetch → catalogue + forward archive → intelligence report → GitHub Pages.
# Also runs on every push to main. Costs nothing on a public repository.
name: Site and daily data
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC, once a day (CelesTrak updates every 2 h; we need one)
  workflow_dispatch:

permissions:
  contents: write # to store daily snapshots on the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .

      - name: Restore the snapshot archive (data branch)
        run: |
          git fetch origin data:data 2>/dev/null && git worktree add archive data || mkdir -p archive
          mkdir -p archive/snapshots

      - name: Fetch CelesTrak once and rebuild the catalogue
        # A 403 "not updated since your last download" (shared runner IP) or any other HTTP error
        # is never retried: the snapshot committed in the repository is published instead.
        run: |
          python -m raan.catalog.build --fetch --archive archive/snapshots \
            || echo "::warning::CelesTrak data not refreshed; publishing the committed snapshot"

      - name: Intelligence report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q anthropic; fi
          python -m raan.intel.run --archive archive/snapshots

      - name: Store today's snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          cd archive
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q -b data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "raan-archiver" && git config user.email "actions@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || git commit -q -m "snapshot $(date -u +%F)"
          git push -q origin data || echo "::warning::could not push the data branch"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
